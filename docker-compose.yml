services:
  api:
    build: .
    image: http1-audit:latest
    environment:
      PORT: "8080"
    ports:
      # Host-side port is configurable: API_PORT=9090 docker compose up -d
      - "${API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "python", "smoke/healthcheck.py"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s
    restart: unless-stopped

  # One-shot job: waits for api health, then runs unit tests, the build
  # check and fixed-length/chunked smoke tests, exiting with the result code.
  verify:
    image: http1-audit:latest
    build: .
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_URL: "http://api:8080"
      WORKSPACE: "/srv"
    restart: "no"
    healthcheck:
      disable: true
    command: ["python", "smoke/verify.py"]
